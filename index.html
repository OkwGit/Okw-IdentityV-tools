<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>军工厂地图示意</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body { min-height: 100svh; display: flex; flex-direction: column; background: #11130f; color: #f4f2e8; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    header, footer { flex: none; text-align: center; padding: 10px 12px; }
    header { font-size: 15px; font-weight: 600; letter-spacing: .04em; }
    footer { color: #b8b8aa; font-size: 12px; }
    main { flex: 1; min-height: 0; display: grid; place-items: center; overflow: hidden; }
    .map { position: relative; width: min(100vw, calc((100svh - 72px) * 1.1806)); aspect-ratio: 1000 / 847; background: #20241e; }
    .map img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .cipher { position: absolute; left: var(--x); top: var(--y); width: clamp(20px, 5vw, 30px); aspect-ratio: 1; display: grid; place-items: center; transform: translate(-50%, -50%); border: 2px solid #fff7d4; border-radius: 50%; background: #e0a938; box-shadow: 0 1px 7px #000c; }
    .cipher::before { content: ""; width: 7px; aspect-ratio: 1; border: 2px solid #382a12; border-radius: 50%; background: #fff5ce; }
    .cipher::after { content: ""; position: absolute; width: 2px; height: 72%; background: #382a12; box-shadow: 0 0 0 1px #e0a938; }
    @media (min-width: 700px) { header, footer { padding: 12px; } .map { width: min(86vw, calc((100svh - 80px) * 1.1806)); } }
  </style>
</head>
<body>
  <header>军工厂 · 密码机位置示意</header>
  <main>
    <div class="map" role="img" aria-label="军工厂地图，标有四个示例密码机位置">
      <img src="assests/maps/ArmsFactory.webp" alt="军工厂俯视地图">
      <span class="cipher" style="--x: 20%; --y: 24%" aria-hidden="true"></span>
      <span class="cipher" style="--x: 48%; --y: 34%" aria-hidden="true"></span>
      <span class="cipher" style="--x: 72%; --y: 47%" aria-hidden="true"></span>
      <span class="cipher" style="--x: 39%; --y: 73%" aria-hidden="true"></span>
    </div>
  </main>
  <footer>标记仅为示例，不代表实际密码机点位</footer>
</body>
</html>
